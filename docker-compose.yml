name: mlops-nginx

services:
  api-v1:
    build:
      context: .
      dockerfile: src/api/v1/Dockerfile
    expose:
      - "8000"
    deploy:
      replicas: 3

  # Debug version, only reached via header "X-Experiment-Group: debug"
  api-v2:
    build:
      context: .
      dockerfile: src/api/v2/Dockerfile
    expose:
      - "8000"

  nginx:
    build:
      context: deployments/nginx/
      dockerfile: Dockerfile
    container_name: nginx_revproxy
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - api-v1
      - api-v2

  # Converts Nginx stub_status into Prometheus metrics; port 8081 of
  # nginx is not published, so /nginx_status stays internal
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: nginx_exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    expose:
      - "9113"
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  prometheus_data:
  grafana_data: